name: Test complete ML pipeline

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-inputs
          path: source.zip
          retention-days: 7
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements/*.txt
      - name: Create the same virtual environment as the runbook
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          mkdir -p reports
          python -m pip install --quiet -r requirements-dev.txt -r requirements-browser.txt
          python -m pip check
          python -m dvc dag
      - name: Install Chromium and Firefox
        run: |
          python -m playwright install --with-deps chromium firefox > reports/browser-install.log 2>&1 || { tail -100 reports/browser-install.log; exit 1; }
      - name: Unit and integration tests; no skipped tests permitted
        run: |
          python -m pytest -q --junitxml=reports/junit.xml
          python -c 'import xml.etree.ElementTree as E; assert all(int(s.get("skipped", "0")) == 0 for s in E.parse("reports/junit.xml").iter("testsuite"))'
      - name: Verify and deploy the checked-in trained model
        run: |
          python scripts/example_model.py verify > reports/example-verification.json
          python scripts/example_model.py install
          python -m pmldl.deployment
          python scripts/verify_browser_schedule.py --existing --evidence-dir reports/browser-example
      - name: Real systemd user service start, crash recovery and stop
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          python scripts/verify_service.py
      - name: Same browser tabs across two real five-minute deployments and MLflow UI
        run: python scripts/verify_browser_schedule.py
      - name: Nondefault ports and Compose project with both browsers
        run: |
          python pipeline.py down
          export API_PORT=18000 APP_PORT=18501 COMPOSE_PROJECT_NAME=pmldl-iris-alt
          python pipeline.py run
          python scripts/verify_browser_schedule.py --existing --evidence-dir reports/browser-alt
          python pipeline.py down
      - name: Export verified model candidate for inclusion in the repository
        run: python scripts/example_model.py export --directory reports/example-candidate
      - name: Show verification summaries and service logs
        if: always()
        run: |
          find reports -name summary.json -print -exec cat {} \;
          docker compose -p pmldl-iris -f code/deployment/docker-compose.yml logs --no-color --tail 50 || true
          if [ -f reports/browser/summary.json ] && ! grep -q '"status": "passed"' reports/browser/summary.json; then
            tail -100 reports/browser/scheduler.log
          fi
      - name: Upload actual model, test evidence, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: |
            reports/
            runs/
            models/model.joblib
            models/metadata.json
            data/processed/cleaning_report.json
            dvc.lock
          retention-days: 7
      - name: Remove only this job's test containers
        if: always()
        run: |
          docker compose -p pmldl-iris -f code/deployment/docker-compose.yml down
          API_PORT=18000 APP_PORT=18501 docker compose -p pmldl-iris-alt -f code/deployment/docker-compose.yml down

  windows:
    name: Native Windows Python and DVC
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements/*.txt
      - name: Create native Windows venv
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install and check dependencies
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m dvc dag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows tests including real locks and process cancellation
        run: |
          # systemd unit rendering/installation is Linux-only, not a Windows feature.
          python -m pytest -q --ignore=tests/test_service.py --junitxml=reports/junit-windows.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import xml.etree.ElementTree as E; assert all(int(s.get('skipped', '0')) == 0 for s in E.parse('reports/junit-windows.xml').iter('testsuite'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Two real native DVC and MLflow training runs and model reload
        run: |
          python scripts/verify_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native Windows evidence (not Docker Desktop certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence
          path: |
            reports/
            runs/
            models/metadata.json
            dvc.lock
          retention-days: 7
