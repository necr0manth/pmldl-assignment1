name: Test complete ML pipeline

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements/*.txt
      - name: Install dependencies
        run: |
          mkdir -p reports
          python -m pip install --quiet -r requirements-dev.txt -r requirements-browser.txt
          python -m pip check
          python -m dvc dag
      - name: Install real Chromium browser
        run: |
          python -m playwright install --with-deps chromium > reports/browser-install.log 2>&1 || { tail -100 reports/browser-install.log; exit 1; }
      - name: Unit and integration tests including MLflow and Streamlit
        run: python -m pytest -q --junitxml=reports/junit.xml
      - name: Browser E2E and two real five-minute scheduled Docker deployments
        run: python scripts/verify_browser_schedule.py
      - name: Show browser verification summary
        if: always()
        run: |
          if [ -f reports/browser/summary.json ]; then
            cat reports/browser/summary.json
            echo '## Browser and real scheduler verification' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/browser/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Show service status and logs
        if: always()
        run: |
          docker compose -p pmldl-iris -f code/deployment/docker-compose.yml ps -a
          docker compose -p pmldl-iris -f code/deployment/docker-compose.yml logs --no-color --tail 100
          if [ -f reports/browser/summary.json ] && ! grep -q '"status": "passed"' reports/browser/summary.json; then
            tail -100 reports/browser/scheduler.log
          fi
      - name: Upload run evidence and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: |
            reports/
            runs/
            models/metadata.json
            data/processed/cleaning_report.json
            dvc.lock
          retention-days: 7
      - name: Clean up CI containers
        if: always()
        run: docker compose -p pmldl-iris -f code/deployment/docker-compose.yml down
